name: Evariant
description: Evariant was a healthcare customer relationship management (CRM) software company founded
  in 2008, offering a Salesforce-aligned platform for health systems covering consumer/patient engagement,
  physician relationship management, marketing planning, appointment reminders, and service-line growth
  analytics. Evariant was acquired by Healthgrades in January 2020 and fully absorbed into "Evariant, a
  Healthgrades company"; the independent product and brand were retired. As of this enrichment pass the
  former evariant.com domain 301-redirects to a parked GoDaddy marketplace page, and Evariant publishes no
  independent public API, developer portal, SDK, or documentation surface.
